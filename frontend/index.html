<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/SymbolsNerdFontMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pane</title>
    <script>
      const themeClasses = {
        'light': ['light'],
        'light-rounded': ['light', 'light-rounded'],
        'dark': ['dark'],
        'oled': ['dark', 'oled'],
        'dusk': ['dark', 'dusk'],
        'dusk-oled': ['dark', 'dusk', 'dusk-oled'],
        'forge': ['dark', 'forge'],
        'ember': ['dark', 'ember'],
        'aurora': ['dark', 'aurora'],
        'night-owl': ['dark', 'night-owl'],
        'night-owl-oled': ['dark', 'night-owl', 'night-owl-oled'],
        'terracotta': ['dark', 'terracotta'],
        'synthwave': ['dark', 'synthwave'],
        'acid': ['dark', 'acid'],
        'tokyo-rain': ['dark', 'tokyo-rain'],
        'folio': ['light', 'folio'],
        'newsprint': ['light', 'newsprint'],
        'walnut': ['dark', 'walnut'],
        'amber-crt': ['dark', 'amber-crt'],
        'teletype': ['light', 'teletype'],
        'dot-matrix': ['dark', 'dot-matrix'],
        'haar': ['light', 'haar'],
        'abyss': ['dark', 'abyss'],
        'understory': ['dark', 'understory'],
        'colorblind-safe': ['dark', 'colorblind-safe'],
        'low-fatigue': ['dark', 'low-fatigue'],
        'high-legibility': ['light', 'high-legibility'],
      };
      try {
        const defaults = { appearanceMode: 'system', theme: 'light-rounded', systemLightTheme: 'light-rounded', systemDarkTheme: 'dark' };
        const snapshot = window.electronAPI?.appearanceSnapshot;
        let cached;
        try {
          const parsed = JSON.parse(localStorage.getItem('pane.appearance.v1') || 'null');
          cached = parsed?.v === 1 ? parsed : undefined;
        } catch { cached = undefined; }
        const legacy = localStorage.getItem('theme');
        const hasTheme = (value) => typeof value === 'string' && Object.prototype.hasOwnProperty.call(themeClasses, value);
        const source = snapshot || cached || (hasTheme(legacy) ? { ...defaults, appearanceMode: 'fixed', theme: legacy } : defaults);
        const fixedTheme = hasTheme(source.theme) ? source.theme : defaults.theme;
        const lightTheme = hasTheme(source.systemLightTheme) && themeClasses[source.systemLightTheme][0] === 'light' ? source.systemLightTheme : defaults.systemLightTheme;
        const darkTheme = hasTheme(source.systemDarkTheme) && themeClasses[source.systemDarkTheme][0] === 'dark' ? source.systemDarkTheme : defaults.systemDarkTheme;
        const mode = source.appearanceMode === 'fixed' ? 'fixed' : 'system';
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'fixed' ? fixedTheme : (prefersDark ? darkTheme : lightTheme);
        window.__paneBootstrapThemeClasses = themeClasses[resolved];
        document.documentElement.classList.add(...window.__paneBootstrapThemeClasses);
        document.documentElement.style.colorScheme = themeClasses[resolved][0];
        if (localStorage.getItem('high-contrast') === 'true') document.documentElement.classList.add('high-contrast');
      } catch {
        window.__paneBootstrapThemeClasses = ['light', 'light-rounded'];
        document.documentElement.classList.add(...window.__paneBootstrapThemeClasses);
        document.documentElement.style.colorScheme = 'light';
        if (localStorage.getItem('high-contrast') === 'true') document.documentElement.classList.add('high-contrast');
      }
    </script>
  </head>
  <body>
    <script>
      const cls = window.__paneBootstrapThemeClasses || ['light', 'light-rounded'];
      document.body.classList.add(...cls);
      if (localStorage.getItem('high-contrast') === 'true') document.body.classList.add('high-contrast');
    </script>
    <div id="root"></div>
    <script>
      // Paint last session's title bar and sidebar (src/utils/staticShell.ts) until React's own have loaded.
      try {
        const saved = JSON.parse(localStorage.getItem('pane.staticShell.v1') || 'null');
        if (saved?.v === 1 && typeof saved.html === 'string' && window.electronAPI) {
          const shell = document.createElement('div');
          shell.id = 'static-shell';
          shell.inert = true;
          shell.style.cssText = 'position:fixed;inset:0;z-index:2147483647';
          shell.innerHTML = saved.html;
          document.body.appendChild(shell);
          // Never outlive a renderer that failed to boot.
          setTimeout(() => shell.remove(), 15000);
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
