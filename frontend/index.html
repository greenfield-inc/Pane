<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/SymbolsNerdFontMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pane</title>
    <script>
      const themeClasses = __PANE_THEME_CLASSES__;
      try {
        const defaults = __PANE_DEFAULT_APPEARANCE__;
        const snapshot = window.electronAPI?.appearanceSnapshot;
        let cached;
        try {
          const parsed = JSON.parse(localStorage.getItem('pane.appearance.v1') || 'null');
          cached = parsed?.v === 1 ? parsed : undefined;
        } catch { cached = undefined; }
        const legacy = localStorage.getItem('theme');
        const hasTheme = (value) => typeof value === 'string' && Object.prototype.hasOwnProperty.call(themeClasses, value);
        const source = snapshot || cached || (hasTheme(legacy) ? { ...defaults, appearanceMode: 'fixed', theme: legacy } : defaults);
        const fixedTheme = hasTheme(source.theme) ? source.theme : defaults.theme;
        const lightTheme = hasTheme(source.systemLightTheme) && themeClasses[source.systemLightTheme][0] === 'light' ? source.systemLightTheme : defaults.systemLightTheme;
        const darkTheme = hasTheme(source.systemDarkTheme) && themeClasses[source.systemDarkTheme][0] === 'dark' ? source.systemDarkTheme : defaults.systemDarkTheme;
        const mode = source.appearanceMode === 'fixed' ? 'fixed' : 'system';
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const resolved = mode === 'fixed' ? fixedTheme : (prefersDark ? darkTheme : lightTheme);
        window.__paneBootstrapThemeClasses = themeClasses[resolved];
        document.documentElement.classList.add(...window.__paneBootstrapThemeClasses);
        document.documentElement.style.colorScheme = themeClasses[resolved][0];
        if (localStorage.getItem('high-contrast') === 'true') document.documentElement.classList.add('high-contrast');
      } catch {
        window.__paneBootstrapThemeClasses = ['light', 'light-rounded'];
        document.documentElement.classList.add(...window.__paneBootstrapThemeClasses);
        document.documentElement.style.colorScheme = 'light';
        if (localStorage.getItem('high-contrast') === 'true') document.documentElement.classList.add('high-contrast');
      }
    </script>
  </head>
  <body>
    <script>
      const cls = window.__paneBootstrapThemeClasses || ['light', 'light-rounded'];
      document.body.classList.add(...cls);
      if (localStorage.getItem('high-contrast') === 'true') document.body.classList.add('high-contrast');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
