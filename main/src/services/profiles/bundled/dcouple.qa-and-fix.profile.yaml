# dcouple/qa-and-fix: written by `node scripts/import-agent-farm-profiles.js` from Agent Farm's dcouple plugin 0.1.27; don't edit by hand.
# A single agent step: the run ends when the agent reports done.
format: pane-profile/1
name: dcouple-qa-and-fix
version: 0.1.27
title: Test a finished pull request, fix the small safe problems it finds, and tell you when it's tested and ready, or what still needs you.

agents:
  qa-and-fix:
    runs: claude/claude-opus-5-5
    effort: medium
    reads: [agents/qa-lead]
    skills: [pr-test-automation, investigate, tdd, quick-verify, babysit-pr, session-trace, ui-options]

flow:
  start: work
  work:
    agent: qa-and-fix
    goal: Test a finished pull request, fix the small safe problems it finds, and tell you when it's tested and ready, or what still needs you
    outcomes: {done: end}

samples:
  work:
    done: ["Done: what it did, with links to what it made.", "Done: what it found, and what is left for you to decide."]
