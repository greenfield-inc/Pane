# dcouple/audits: written by `node scripts/import-agent-farm-profiles.js` from Agent Farm's dcouple plugin 0.1.27; don't edit by hand.
# A single agent step: the run ends when the agent reports done.
format: pane-profile/1
name: dcouple-audits
version: 0.1.27
title: Find outdated issues, pull requests, and docs, and suggest what to close or update. Changes nothing until you approve.

agents:
  audits:
    runs: claude/claude-opus-5-5
    effort: high
    reads: [agents/audits]
    skills: [audits]

flow:
  start: work
  work:
    agent: audits
    goal: Find outdated issues, pull requests, and docs, and suggest what to close or update. Changes nothing until you approve
    outcomes: {done: end}

samples:
  work:
    done: ["Done: what it did, with links to what it made.", "Done: what it found, and what is left for you to decide."]
