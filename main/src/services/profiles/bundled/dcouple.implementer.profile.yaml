# dcouple/implementer: written by `node scripts/import-agent-farm-profiles.js` from Agent Farm's dcouple plugin 0.1.27; don't edit by hand.
# A single agent step: the run ends when the agent reports done.
format: pane-profile/1
name: dcouple-implementer
version: 0.1.27
title: Take a ticket from start to a reviewed pull request.

agents:
  implementer:
    runs: codex/gpt-6-astra
    effort: medium
    reads: [agents/implementer]
    skills: [astra-ticket, implement, refactor, refactor-simple, refactor-deep, refactor-apply, create-ticket, ui-mockup, explain-visually, simple-plan, create-plan, prepare-pr, pr-test-automation, review, cold-read, excalidraw-pr-diagrams, implementer, implementation-reviewer, plan-reviewer, codebase-explorer, researcher, research-web, investigate, session-trace, pr-understanding-check]

flow:
  start: work
  work:
    agent: implementer
    goal: Take a ticket from start to a reviewed pull request
    outcomes: {done: end}

samples:
  work:
    done: ["Done: what it did, with links to what it made.", "Done: what it found, and what is left for you to decide."]
