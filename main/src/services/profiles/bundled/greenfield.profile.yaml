# greenfield, in four primitives: agent · step · outcome · ask
# Pane draws this file as its workflow and runs it step by step: an agent step ends when its
# agent reports one of the step's outcomes; a command's exit code picks its outcome (0 → the
# first, anything else → the second); an ask waits for you in Approvals.
format: pane-profile/1
name: greenfield
version: 1.0.0
title: Plan, build and review, one Pane per feature
description: A planner turns your request into a plan you approve, an implementer builds it and opens a PR, CI runs, a reviewer decides what must change, and you decide when to merge.

# BEGIN agents: written by `node scripts/import-agent-farm-profiles.js` from Agent Farm's greenfield plugin 0.0.46; don't edit by hand.
agents:
  planner:
    runs: claude/claude-opus-5-5
    effort: high
    reads: [standing-rules, planner-documents, planner-identity]
    skills: [explain, brief, options, spike, plan, research-and-product-design, ui-mockup, page, session-trace, tdd, codebase-design, verify-app, prepare-pr, babysit-pr, interview, architecture-diagram, swarm, excalidraw-pr-diagrams, cold-read]
  implementer:
    runs: claude/claude-opus-5-5
    effort: medium
    reads: [standing-rules]
    skills: [prepare-pr, page, excalidraw-pr-diagrams, create-ticket, babysit-pr, tdd, codebase-design, handoff, smallest-test, investigate, quick-verify, pr-test-automation, ui-mockup, research-web, refactor, session-trace, architecture-diagram, swarm]
  reviewer:
    runs: codex/gpt-6.1-sol
    effort: max
    skills: [principled-review, review, pr-test-automation]
  orchestrator:
    runs: claude/claude-opus-5-5
    effort: medium
    reads: [standing-rules, coordination]
    skills: [orchestrate-sessions, page, session-trace, architecture-diagram, interview, research-and-product-design, pr-understanding-check, prepare-pr, excalidraw-pr-diagrams, cold-read]
  qa-lead:
    runs: claude/claude-opus-5-5
    effort: medium
    reads: [standing-rules]
    skills: [pr-test-automation, investigate, tdd, quick-verify, babysit-pr, session-trace, ui-options, prepare-pr, page, excalidraw-pr-diagrams, cold-read]
# END agents

flow:
  start: plan
  plan:    { agent: planner, goal: Turn the request into a plan,
             outcomes: { plan ready: approve, needs you: answer } }
  answer:  { ask: Answer the planner's question, next: plan }
  approve: { ask: Approve the plan?, choices: { approve: build, change it: plan } }
  build:   { agent: implementer, goal: Build it and open a PR,
             outcomes: { PR ready: checks, needs you: unblock } }
  unblock: { ask: Unblock the implementer, next: build }
  checks:  { run: gh pr checks --watch, title: CI + QA checks,
             outcomes: { green: review, red: build } }
  review:  { agent: reviewer, goal: Decide what must change,
             outcomes: { approved: merge, findings: triage } }
  triage:  { agent: orchestrator, goal: Route the findings,
             outcomes: { fix now: build, out of scope: merge } }
  merge:   { ask: Merge this PR?, choices: { merge: merged, QA first: qa } }
  qa:      { agent: qa-lead, goal: Try the change end to end,
             outcomes: { passed: merge, issues: build } }
  merged:  { run: gh pr merge --merge }

samples:
  plan:
    plan ready:
      - "Plan: retry failed card payments\n1. Retry soft declines twice, 30 s apart\n2. Log each attempt on the order\n3. Tests for both retry paths"
      - "Plan: export invoices as CSV\n1. Export button on the invoices list\n2. One row per invoice, refunds excluded\n3. Tests for totals and currency"
    needs you:
      - "Q-1: Should retries go to the backup payment provider, or the same one?"
      - "Q-1: Should the CSV include refunded invoices?"
  build:
    PR ready:
      - "PR #88 Retry failed card payments\n+142 −18 · 6 files · tests added"
      - "PR #91 Export invoices as CSV\n+96 −4 · 4 files · tests added"
    needs you:
      - "Blocked: the staging card sandbox key is missing.\nAdd it under Settings › Secrets?"
      - "Blocked: two invoice tables exist (invoices, invoices_v2).\nWhich one is current?"
  review:
    approved:
      - "Approved. No Must-Fix findings.\nOne naming nit left as a comment."
      - "Approved after fixes. F-1 resolved at 4be21c0."
    findings:
      - "F-1 Must-Fix: a late timeout can charge the card twice."
      - "F-1 Must-Fix: CSV totals ignore each invoice's currency."
  triage:
    fix now:
      - "F-1 is in scope: sending it to the implementer."
      - "F-1 is in scope: the CSV must show each invoice's currency.\nSending it to the implementer."
    out of scope:
      - "F-2 (rename PaymentRetry) is out of scope: filed as follow-up #95."
      - "F-3 (paginate the invoice list) is out of scope: filed as follow-up #97."
  qa:
    passed:
      - "QA passed: a declined card retried twice;\nthe order shows both attempts. 4 screenshots."
      - "QA passed: exported 120 invoices;\ntotals match the dashboard. 3 screenshots."
    issues:
      - "QA issue: the retry banner stays after the payment succeeds."
      - "QA issue: Excel shows broken accents (needs a UTF-8 BOM)."

runs:
  A:   # the smooth path
    - plan: "plan ready #1"
    - approve: approve
    - build: "PR ready #1"
    - checks: green
    - review: "approved #1"
    - merge: merge
    - merged
  B:   # a question, a red build, a finding, and QA
    - plan: "needs you #2"
    - answer: "Exclude refunds; they have their own report."
    - plan: "plan ready #2"
    - approve: approve
    - build: "PR ready #2"
    - checks: red
    - build: "PR ready #2"
    - checks: green
    - review: "findings #2"
    - triage: "fix now #2"
    - build: "PR ready #2"
    - checks: green
    - review: "approved #2"
    - merge: QA first
    - qa: "passed #2"
    - merge: merge
    - merged
