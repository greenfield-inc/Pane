# Expo Updates protocol v1 over static files. A phone asks GET /manifest with
# expo-platform and expo-runtime-version headers; both are checked against a
# fixed pattern before they name a file, so a header can't leave updates/.
map $http_expo_platform $update_platform {
  ios ios;
  android android;
  default "";
}

map $http_expo_runtime_version $update_runtime {
  "~^[0-9A-Za-z][0-9A-Za-z._-]*$" $http_expo_runtime_version;
  default "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  absolute_redirect off;

  gzip on;
  gzip_types application/javascript application/json application/octet-stream;

  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain; charset=utf-8";
    return 200 "ok\n";
  }

  location = /manifest {
    if ($update_platform = "") { return 400; }
    if ($update_runtime = "") { return 400; }
    default_type application/json;
    add_header expo-protocol-version 1 always;
    add_header expo-sfv-version 0 always;
    add_header Cache-Control "no-cache" always;
    try_files /updates/$update_runtime/$update_platform/manifest.json @no-update;
  }

  # No manifest for this runtime: the phone keeps the update it has.
  location @no-update {
    add_header expo-protocol-version 1 always;
    add_header Cache-Control "no-cache" always;
    return 204;
  }

  # Bundles and assets have content-hashed names.
  location /files/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
