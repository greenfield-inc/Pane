name: Playwright browsers
description: >-
  Restores Playwright's Chromium from the Actions cache that pushes to main
  write, then installs it with its system packages. Run it after the install.
# Playwright's CDN took 35-103 s for one browser on some runs; the cache holds
# the browser folder, keyed on the image's OS family, arch and playwright-core
# version, so a key never serves another browser build. The system packages
# still come from apt on every run.
inputs:
  install:
    description: Run the browser install here; false restores only, for a job that installs in the background.
    default: 'true'
  save:
    description: Save the browsers on a push to main when the cache missed. One job per key saves.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Key the Playwright browsers
      id: key
      shell: bash
      run: echo "key=playwright-${ImageOS}-${{ runner.arch }}-$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Restore the Playwright browsers
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.key.outputs.key }}

    - name: Install Playwright browser dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Save the Playwright browsers
      if: inputs.install == 'true' && inputs.save == 'true' && steps.cache.outputs.cache-hit != 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.key.outputs.key }}
