name: Runpane Cloud desktop test build (fork)

# Fork-only. Builds the Pane desktop for Windows (x64) and macOS (arm64, x64) as
# an unsigned SIDE-BY-SIDE test build and publishes it as the fork PRERELEASE
# rc-desktop-<sha8>. It never publishes to upstream channels and uses no signing
# secrets.
#
# A side-by-side build carries `paneSideBySide` in its packaged package.json
# (main/src/utils/sideBySide.ts): its data and Chromium profile live in
# ~/.pane_cloudtest, it keeps its own single-instance lock, and it never registers
# a login item, a pane:// handler, agent MCP servers or skills, or checks for
# updates. It runs next to an installed Pane without touching it; each platform
# job proves that against the released Pane installed on the runner.
#
# The app is built from `ref`; the relay kit (scripts/cloud-dist/sobeck) always
# comes from the commit the workflow runs from, so a new kit can ship with an
# existing release's app. The tag is rc-desktop-<app sha8>, plus -k<kit sha8>
# when the two differ.
on:
  push:
    branches:
      - rc/p6/p6-desktop-kit
    paths:
      - .github/workflows/rc-desktop.yml
      - scripts/cloud-dist/sobeck/**
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build the app from (default the branch the workflow runs from)
        type: string
        default: ''
      macos:
        description: Also build macOS
        type: boolean
        default: true
      proof_tag:
        description: Only rerun the relay kit proof against this existing rc-desktop-* prerelease
        type: string
        default: ''
      app_from:
        description: Kit-only release - reuse this rc-desktop-* release's app zips byte for byte (it must be built from ref) instead of building
        type: string
        default: ''
      upgrade_from:
        description: rc-desktop-* prerelease the relay proof installs first, then upgrades in place (empty = fresh install only)
        type: string
        default: rc-desktop-e334a84b

permissions:
  contents: read

concurrency:
  group: rc-desktop-${{ inputs.ref || github.ref }}-${{ github.sha }}-${{ inputs.proof_tag }}
  cancel-in-progress: false

env:
  SIDE_BY_SIDE_NAME: cloudtest
  # The released Pane the smoke runs beside (Red's installed version).
  INSTALLED_RELEASE: v2.4.141
  # Never sign, whatever the runner has.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  CSC_DISABLE: 'true'

jobs:
  meta:
    name: Version and checks
    if: github.repository != 'greenfield-inc/Pane'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      kit_sha: ${{ steps.meta.outputs.kit_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.sha }}

    - id: meta
      name: Version = <pkg>-rc.<commit UTC time>.g<sha8> (as scripts/cloud-dist)
      env:
        KIT_SHA: ${{ github.sha }}
        APP_FROM: ${{ inputs.app_from }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        sha=$(git rev-parse HEAD)
        if [ -n "$APP_FROM" ]; then
          from=$(gh release view "$APP_FROM" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)
          if [ "$from" != "$sha" ]; then echo "app_from $APP_FROM was built from $from, not ref $sha" >&2; exit 1; fi
        fi
        stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
        version="$(node -p 'require("./package.json").version')-rc.${stamp}.g${sha:0:8}"
        tag="rc-desktop-${sha:0:8}"
        if [ "$KIT_SHA" != "$sha" ]; then tag="${tag}-k${KIT_SHA:0:8}"; fi
        { echo "sha=$sha"; echo "kit_sha=$KIT_SHA"; echo "version=$version"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
        echo "Building $version from $sha, relay kit from $KIT_SHA, as $tag" >> "$GITHUB_STEP_SUMMARY"

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install --ignore-scripts

    - name: Typecheck main
      run: pnpm --filter main typecheck

    - name: Side-by-side unit tests
      run: CI=1 pnpm --filter main exec vitest run src/utils/sideBySide.test.ts src/utils/appDirectory.test.ts

  windows:
    name: Windows x64
    needs: meta
    if: ${{ !inputs.proof_tag && !inputs.app_from }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.meta.outputs.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build (unpacked, unsigned, side-by-side)
      shell: bash
      run: >-
        node scripts/build-win.js x64 --
        -c.win.target=dir
        -c.appId=com.dcouple.pane.${{ env.SIDE_BY_SIDE_NAME }}
        -c.extraMetadata.version=${{ needs.meta.outputs.version }}
        -c.extraMetadata.paneSideBySide=${{ env.SIDE_BY_SIDE_NAME }}

    - name: Package zip
      shell: pwsh
      run: |
        $name = "Pane-CloudTest-${{ needs.meta.outputs.version }}-Windows-x64"
        New-Item -ItemType Directory -Force -Path release | Out-Null
        Move-Item dist-electron\win-unpacked "dist-electron\$name"
        Push-Location dist-electron
        7z a -tzip -mx=7 "..\release\$name.zip" $name | Select-Object -Last 3
        Pop-Location
        Move-Item "dist-electron\$name" dist-electron\win-unpacked
        Get-ChildItem release

    - name: Download the released Pane for the side-by-side smoke
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release download $env:INSTALLED_RELEASE --repo greenfield-inc/Pane --pattern "Pane-*-Windows-x64.exe" --dir installed

    - name: Side-by-side smoke
      shell: pwsh
      run: |
        $setup = (Get-ChildItem installed\*.exe | Select-Object -First 1).FullName
        scripts\cloud-dist\desktop-side-by-side-smoke.ps1 -TestExe "$PWD\dist-electron\win-unpacked\Pane.exe" `
          -ExpectedVersion "${{ needs.meta.outputs.version }}" -InstalledSetup $setup `
          -SideBySideName $env:SIDE_BY_SIDE_NAME -OutDir smoke-windows

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-windows
        path: smoke-windows
        if-no-files-found: warn

    - uses: actions/upload-artifact@v7
      with:
        name: desktop-windows
        path: release/*.zip
        if-no-files-found: error
        retention-days: 14

  macos:
    name: macOS arm64 + x64
    needs: meta
    # inputs.macos is null on push, and Actions compares null == false.
    if: github.event_name != 'workflow_dispatch' || (inputs.macos && !inputs.proof_tag && !inputs.app_from)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.meta.outputs.sha }}

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install

    - name: Build (unpacked, unsigned, side-by-side)
      run: |
        set -euo pipefail
        pnpm run build:frontend
        pnpm run build:main
        pnpm run inject-build-info
        pnpm run generate-notices
        node scripts/configure-build.js
        # A separate bundle id: macOS would otherwise bring the installed Pane
        # forward instead of opening this one.
        pnpm exec electron-builder --mac dir --arm64 --x64 --publish never \
          -c.appId=com.dcouple.pane.${SIDE_BY_SIDE_NAME} \
          -c.extraMetadata.version=${{ needs.meta.outputs.version }} \
          -c.extraMetadata.paneSideBySide=${SIDE_BY_SIDE_NAME}
        node scripts/verify-mac-universal-binaries.js

    - name: Ad-hoc sign and zip
      run: |
        set -euo pipefail
        mkdir -p release
        for pair in "mac-arm64:arm64" "mac:x64"; do
          dir=${pair%%:*}; arch=${pair##*:}
          stage="stage-$arch"
          mkdir -p "$stage"
          ditto "dist-electron/$dir/Pane.app" "$stage/Pane Cloud Test.app"
          # Unsigned arm64 apps do not start at all; an ad-hoc signature is enough.
          codesign --force --deep --sign - "$stage/Pane Cloud Test.app"
          codesign --verify --deep --strict "$stage/Pane Cloud Test.app"
          ditto -c -k --keepParent "$stage/Pane Cloud Test.app" \
            "release/Pane-CloudTest-${{ needs.meta.outputs.version }}-macOS-$arch.zip"
        done
        ls -la release

    - name: Side-by-side smoke (arm64)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release download "$INSTALLED_RELEASE" --repo greenfield-inc/Pane --pattern 'Pane-*-macOS-arm64.zip' --dir installed
        mkdir -p smoke-app && ditto -x -k release/*-macOS-arm64.zip smoke-app
        bash scripts/cloud-dist/desktop-side-by-side-smoke-mac.sh "$PWD/smoke-app/Pane Cloud Test.app" \
          "${{ needs.meta.outputs.version }}" installed/*.zip "$SIDE_BY_SIDE_NAME" smoke-macos

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: smoke-macos
        path: smoke-macos
        if-no-files-found: warn

    - uses: actions/upload-artifact@v7
      with:
        name: desktop-macos
        path: release/*.zip
        if-no-files-found: error
        retention-days: 14

  release:
    name: Publish fork prerelease rc-desktop-<sha8>
    needs: [meta, windows, macos]
    if: >-
      always() &&
      github.repository != 'greenfield-inc/Pane' &&
      !inputs.proof_tag &&
      (needs.windows.result == 'success' || (inputs.app_from && needs.windows.result == 'skipped')) &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.meta.outputs.kit_sha }}

    - uses: actions/download-artifact@v7
      if: ${{ !inputs.app_from }}
      with:
        pattern: desktop-*
        path: release
        merge-multiple: true

    - name: The app zips of ${{ inputs.app_from }}, byte for byte (kit-only release)
      if: ${{ inputs.app_from }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh release download "${{ inputs.app_from }}" --repo "$GITHUB_REPOSITORY" --dir release \
          --pattern '*-Windows-x64.zip' --pattern '*-macOS-*.zip' --pattern SHA256SUMS.txt
        (cd release && grep -E -- '-(Windows-x64|macOS-[a-z0-9]+)\.zip$' SHA256SUMS.txt | sha256sum -c - && rm SHA256SUMS.txt)

    # The relay kit: the scripts that install the test build, save a cloud host into its data dir from
    # a pairing file and drive it with Playwright (scripts/cloud-dist/sobeck), plus playwright-core at
    # the repo's version. The test build's Pane.exe runs it as Node, so the target needs no Node.
    - name: Build the relay kit
      env:
        VERSION: ${{ needs.meta.outputs.version }}
      run: |
        set -euo pipefail
        playwright=$(grep -m1 -oE "^  '@playwright/test@[0-9.]+'" pnpm-lock.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        kit=kit/relay-kit
        mkdir -p "$kit"
        cp scripts/cloud-dist/sobeck/{install.ps1,run-proof.ps1,remove.ps1,seed-profile.cjs,proof.mjs,run-session-proof.ps1,session-proof.mjs,session-checks.sh} "$kit/"
        (cd "$kit" && echo '{"private":true}' > package.json && npm install --no-audit --no-fund --no-package-lock "playwright-core@$playwright")
        (cd kit && zip -qr "../release/Pane-CloudTest-relay-kit-$VERSION.zip" relay-kit)
        cp scripts/cloud-dist/sobeck/install.ps1 release/sobeck-install.ps1

    - name: Publish prerelease
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.meta.outputs.tag }}
        SHA: ${{ needs.meta.outputs.sha }}
        KIT_SHA: ${{ needs.meta.outputs.kit_sha }}
        APP_FROM: ${{ inputs.app_from }}
        VERSION: ${{ needs.meta.outputs.version }}
      run: |
        set -euo pipefail
        case "$REPO" in greenfield-inc/*) echo "refusing to publish to $REPO" >&2; exit 1 ;; esac
        cd release
        rm -f SHA256SUMS.txt
        sha256sum -- * > SHA256SUMS.txt
        cat SHA256SUMS.txt
        NOTES="Unsigned SIDE-BY-SIDE desktop test build of ${SHA} (Runpane Cloud fork), built by GitHub Actions run ${GITHUB_RUN_ID}. Not an upstream release; it never updates itself.
        Version: ${VERSION}. Relay kit (scripts/cloud-dist/sobeck) from ${KIT_SHA}.${APP_FROM:+ App zips copied byte for byte from ${APP_FROM} (kit-only release).}
        It keeps its data in ~/.pane_${SIDE_BY_SIDE_NAME} and runs next to an installed Pane without touching it. Remove it by deleting its folder and ~/.pane_${SIDE_BY_SIDE_NAME}.
        Windows: unzip, run Pane.exe inside the folder (SmartScreen: More info, then Run anyway).
        macOS: unzip, then right-click Pane Cloud Test.app and choose Open (or xattr -dr com.apple.quarantine on it)."
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release upload "$TAG" --repo "$REPO" --clobber -- *
        else
          gh release create "$TAG" --repo "$REPO" --prerelease --target "$SHA" \
            --title "Pane desktop side-by-side test build ${TAG#rc-desktop-}" --notes "$NOTES" -- *
        fi
        echo "https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

  # Runs the relay's scripts on a Windows runner against the published prerelease, the way SOBECK will:
  # an earlier kit (upgrade_from) is installed, seeded and run first, then install.ps1 of this release
  # upgrades it in place (the pairing and the saved host must survive) and run-proof.ps1 drives the app.
  # The runner has no tailnet, so a real headless Pane daemon of this release on loopback stands in for
  # the cloud Session (ci-fake-host.ps1, with a fake tailscale.exe so its Session ports work) and Claude's
  # reply is skipped. run-session-proof.ps1 (R3.5) then creates a fresh Pane on it and publishes a port from
  # its terminal (its broker and secrets checks need a real Session). The released Pane runs throughout and
  # must be left untouched.
  relay-proof:
    name: Relay kit proof (Windows)
    needs: [meta, release]
    if: always() && needs.meta.result == 'success' && (needs.release.result == 'success' || inputs.proof_tag)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.proof_tag || needs.meta.outputs.tag }}
      UPGRADE_FROM: ${{ github.event_name == 'push' && 'rc-desktop-e334a84b' || inputs.upgrade_from }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.meta.outputs.sha }}

    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.meta.outputs.kit_sha }}
        path: kitsrc

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Build the runpane CLI (fake host setup only)
      run: |
        pnpm install --filter runpane --ignore-scripts
        pnpm --filter runpane build

    - name: Install and start the released Pane
      shell: pwsh
      run: |
        gh release download $env:INSTALLED_RELEASE --repo greenfield-inc/Pane --pattern "Pane-*-Windows-x64.exe" --dir installed
        Start-Process -FilePath (Get-ChildItem installed\*.exe)[0].FullName -ArgumentList '/S' -Wait
        # The silent installer can return before Pane.exe is in place (run 36794145980).
        $installedExe = "$env:LOCALAPPDATA\Programs\Pane\Pane.exe"
        $deadline = (Get-Date).AddSeconds(120)
        while ((Get-Date) -lt $deadline -and -not (Test-Path $installedExe)) { Start-Sleep 2 }
        Start-Process $installedExe
        $deadline = (Get-Date).AddSeconds(180)
        while ((Get-Date) -lt $deadline -and -not (Test-Path "$HOME\.pane\openrouter-prices.json")) { Start-Sleep 2 }
        Start-Sleep 15
        New-Item -ItemType Directory -Force relay-evidence | Out-Null
        (Get-ChildItem -Force "$HOME\.pane").Name | Sort-Object | Set-Content relay-evidence\installed-before.txt
        (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' | Out-String) + (Get-ItemProperty 'HKCU:\Software\Classes\pane\shell\open\command' -ErrorAction SilentlyContinue | Out-String) | Set-Content relay-evidence\registry-before.txt

    - name: This release's app for the fake cloud host (a separate copy, like a separate machine)
      shell: pwsh
      run: |
        gh release download $env:TAG --repo $env:REPO --pattern '*-Windows-x64.zip' --dir fake-host-download
        Expand-Archive (Get-ChildItem fake-host-download\*.zip)[0].FullName C:\rc-fake-host-app
        $exe = (Get-ChildItem -Recurse C:\rc-fake-host-app -Filter Pane.exe | Select-Object -First 1).FullName
        "FAKE_HOST_EXE=$exe" >> $env:GITHUB_ENV

    - name: The earlier kit, installed and run (what SOBECK has before the upgrade)
      if: env.UPGRADE_FROM != ''
      shell: pwsh
      run: |
        $base = "https://github.com/$env:REPO/releases/download/$env:UPGRADE_FROM"
        Invoke-WebRequest -UseBasicParsing "$base/sobeck-install.ps1" -OutFile previous-install.ps1
        $sums = (Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS.txt").Content
        if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
        function Sum($pattern) { (($sums -split "`n" | Where-Object { $_ -match $pattern }) -split '\s+')[0] }
        powershell -NoProfile -ExecutionPolicy Bypass -File previous-install.ps1 -Tag $env:UPGRADE_FROM -Repo $env:REPO `
          -AppSha256 (Sum '-Windows-x64\.zip') -KitSha256 (Sum 'relay-kit')
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # Run it once so its data dir holds what a used install has (database, Chromium profile).
        $exe = "$HOME\PaneCloudTest\app\Pane.exe"
        Start-Process $exe
        $deadline = (Get-Date).AddSeconds(180)
        while ((Get-Date) -lt $deadline -and -not (Test-Path "$HOME\.pane_cloudtest\sessions.db")) { Start-Sleep 2 }
        Start-Sleep 10
        Get-Process -Name Pane | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
        Start-Sleep 2
        if (-not (Test-Path "$HOME\.pane_cloudtest\sessions.db")) { Write-Error 'the earlier build never created its data'; exit 1 }
        Write-Host "PASS earlier kit $env:UPGRADE_FROM installed and run"

    # One step: a daemon started in an earlier step does not reliably outlive it on Windows runners.
    - name: Fake cloud host, upgrade in place with install.ps1, then run-proof.ps1
      shell: pwsh
      run: |
        $kit = 'kitsrc\scripts\cloud-dist\sobeck'
        $pairing = "$HOME\PaneCloudTest\pairing.txt"
        & "$kit\ci-fake-host.ps1" -Exe $env:FAKE_HOST_EXE -PairingFile $pairing -RunpaneCli "$PWD\packages\runpane\dist\cli.js"
        $config = "$HOME\.pane_cloudtest\config.json"
        function SavedHosts { if (Test-Path $config) { @((Get-Content -Raw $config | ConvertFrom-Json).remoteDaemon.client.profiles | ForEach-Object { "$($_.id) $($_.label) $($_.baseUrl)" }) } else { @() } }
        if ($env:UPGRADE_FROM) {
          # Save the host with the earlier kit, as SOBECK did in run 1.
          $env:ELECTRON_RUN_AS_NODE = '1'
          $seed = Start-Process -FilePath "$HOME\PaneCloudTest\app\Pane.exe" -Wait -NoNewWindow -PassThru `
            -RedirectStandardOutput seed-previous.out.txt -RedirectStandardError seed-previous.err.txt `
            -ArgumentList "`"$HOME\PaneCloudTest\kit\seed-profile.cjs`" `"$pairing`" `"$HOME\.pane_cloudtest`""
          Remove-Item Env:\ELECTRON_RUN_AS_NODE
          Get-Content seed-previous.out.txt, seed-previous.err.txt | Out-Host
          if ($seed.ExitCode -ne 0) { Write-Error "earlier kit's seed-profile exited $($seed.ExitCode)"; exit 1 }
          $before = SavedHosts
          if ($before.Count -ne 1) { Write-Error "earlier kit saved $($before.Count) hosts"; exit 1 }
        }

        $base = "https://github.com/$env:REPO/releases/download/$env:TAG"
        Invoke-WebRequest -UseBasicParsing "$base/sobeck-install.ps1" -OutFile sobeck-install.ps1
        $sums = (Invoke-WebRequest -UseBasicParsing "$base/SHA256SUMS.txt").Content
        if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
        function Sum($pattern) { (($sums -split "`n" | Where-Object { $_ -match $pattern }) -split '\s+')[0] }
        powershell -NoProfile -ExecutionPolicy Bypass -File sobeck-install.ps1 -Tag $env:TAG -Repo $env:REPO `
          -AppSha256 (Sum '-Windows-x64\.zip') -KitSha256 (Sum 'relay-kit') | Tee-Object -Variable installOutput | Out-Host
        if ($LASTEXITCODE -ne 0) { exit 1 }
        # A proof_tag rerun tests this commit's kit scripts against the release's app.
        if ('${{ inputs.proof_tag }}') { Copy-Item "$kit\*" "$HOME\PaneCloudTest\kit\" -Force -Exclude ci-fake-host.ps1 }
        if ($env:UPGRADE_FROM) {
          $after = SavedHosts
          if (($after -join "`n") -ne ($before -join "`n")) { Write-Error "saved host changed by the upgrade: [$before] -> [$after]"; exit 1 }
          if (-not (Test-Path $pairing) -or -not (Test-Path "$HOME\.pane_cloudtest\sessions.db")) { Write-Error 'the upgrade lost pairing.txt or the data dir'; exit 1 }
          if (-not ($installOutput -match '^Upgraded test build ')) { Write-Error 'install.ps1 did not report the upgrade'; exit 1 }
          Write-Host "PASS upgrade in place kept pairing.txt, the data dir and the saved host ($($after -replace '^\S+ ', ''))"
        }

        $proofArgs = @('-OutDir', "$PWD\relay-evidence\proof", '-NoClaudeReply', '-HostnamePrefix', $env:COMPUTERNAME, '-PortUrl', 'http://localhost:8443/')
        if ($env:UPGRADE_FROM) { $proofArgs += '-SkipSeed' }
        powershell -NoProfile -ExecutionPolicy Bypass -File "$HOME\PaneCloudTest\kit\run-proof.ps1" @proofArgs
        $code = $LASTEXITCODE
        # Again, as on every later SOBECK run: the Pane now has a terminal, which must be reused, not
        # joined by another one (SOBECK run 3 try 1 waited on a hidden new terminal).
        $rerunArgs = @('-OutDir', "$PWD\relay-evidence\proof-rerun", '-NoClaudeReply', '-HostnamePrefix', $env:COMPUTERNAME, '-PortUrl', 'http://localhost:8443/', '-SkipSeed')
        powershell -NoProfile -ExecutionPolicy Bypass -File "$HOME\PaneCloudTest\kit\run-proof.ps1" @rerunArgs
        if ($LASTEXITCODE -ne 0) { $code = $LASTEXITCODE }
        if (Select-String -Path relay-evidence\proof-rerun\steps.log -Pattern 'terminal: reused tab' -Quiet) { Write-Host 'PASS second run reused the Pane terminal' }
        else { Write-Host 'FAIL second run did not reuse the Pane terminal'; $code = 1 }
        # R3.5 against the same fake host: a fresh Pane in montlakev2 created in the UI, its terminal (Git Bash
        # here, bash on a cloud Session), runpane port open -> its chip -> click -> Invoke-WebRequest 200 -> port
        # closed. A runner has no coordinator and no Doppler stand-in, so the broker and secrets checks SKIP.
        powershell -NoProfile -ExecutionPolicy Bypass -File "$HOME\PaneCloudTest\kit\run-session-proof.ps1" -OutDir "$PWD\relay-evidence\session-proof" -NoGitHub
        if ($LASTEXITCODE -ne 0) { $code = 1 }
        $verdicts = @{}
        if (Test-Path relay-evidence\session-proof\results.json) { (Get-Content -Raw relay-evidence\session-proof\results.json | ConvertFrom-Json).checks | ForEach-Object { $verdicts[$_.name] = $_.verdict } }
        $expected = [ordered]@{ 'pane-created' = 'PASS'; 'pane-terminal' = 'PASS'; 'script-delivered' = 'PASS'; 'secrets-at-creation' = 'SKIP'; 'port-open' = 'PASS'; 'ports-chip' = 'PASS'; 'ports-chip-opens' = 'PASS'; 'broker' = 'SKIP'; 'port-closed' = 'PASS'; 'pane-archived' = 'PASS' }
        foreach ($name in $expected.Keys) {
          if ($verdicts[$name] -eq $expected[$name]) { Write-Host "PASS R3.5 $name is $($expected[$name])" } else { Write-Host "FAIL R3.5 $name is '$($verdicts[$name])', expected $($expected[$name])"; $code = 1 }
        }
        # The pairing token must not appear in anything the proof wrote.
        $token = (Get-Content $config -Raw | ConvertFrom-Json).remoteDaemon.client.profiles[0].token
        if (-not $token) { Write-Error 'no saved profile token to search for'; exit 1 }
        $leaks = @(Get-ChildItem -Recurse -File relay-evidence | Select-String -SimpleMatch $token -List)
        if ($leaks.Count -gt 0) { Write-Error "token found in: $(($leaks | ForEach-Object Filename) -join ', ')"; exit 1 }
        Write-Host 'PASS no pairing token in the evidence'
        exit $code

    - name: install.ps1 refuses a wrong hash and a running test build; -CloseRunning -Fresh
      shell: pwsh
      run: |
        $sums = (Invoke-WebRequest -UseBasicParsing "https://github.com/$env:REPO/releases/download/$env:TAG/SHA256SUMS.txt").Content
        if ($sums -is [byte[]]) { $sums = [Text.Encoding]::UTF8.GetString($sums) }
        function Sum($pattern) { (($sums -split "`n" | Where-Object { $_ -match $pattern }) -split '\s+')[0] }
        function Install([string[]]$extra) {
          powershell -NoProfile -ExecutionPolicy Bypass -File sobeck-install.ps1 -Tag $env:TAG -Repo $env:REPO `
            -AppSha256 (Sum '-Windows-x64\.zip') -KitSha256 (Sum 'relay-kit') @extra | Out-Host
          return $LASTEXITCODE
        }
        $failed = $false
        powershell -NoProfile -ExecutionPolicy Bypass -File sobeck-install.ps1 -Tag $env:TAG -Repo $env:REPO `
          -AppSha256 ('0' * 64) -KitSha256 (Sum 'relay-kit') -Root "$HOME\PaneCloudTest-badhash" | Out-Host
        if ($LASTEXITCODE -eq 0 -or (Test-Path "$HOME\PaneCloudTest-badhash\app")) { Write-Host 'FAIL install.ps1 accepted a wrong hash'; $failed = $true } else { Write-Host 'PASS install.ps1 refuses a wrong hash' }

        $exe = "$HOME\PaneCloudTest\app\Pane.exe"
        Start-Process $exe
        Start-Sleep 15
        $code = Install @()
        $alive = [bool](Get-Process -Name Pane -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
        if ($code -eq 0 -or -not $alive) { Write-Host "FAIL install.ps1 ran over a running test build (exit $code, still running: $alive)"; $failed = $true } else { Write-Host 'PASS install.ps1 leaves a running test build alone without -CloseRunning' }
        $code = Install @('-CloseRunning', '-Fresh')
        $alive = [bool](Get-Process -Name Pane -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
        if ($code -ne 0 -or $alive -or (Test-Path "$HOME\.pane_cloudtest") -or -not (Test-Path "$HOME\PaneCloudTest\pairing.txt")) {
          Write-Host "FAIL -CloseRunning -Fresh (exit $code, still running: $alive, data dir left: $(Test-Path "$HOME\.pane_cloudtest"))"; $failed = $true
        } else { Write-Host 'PASS -CloseRunning -Fresh closed the test build, reset its data and kept pairing.txt' }
        if ($failed) { exit 1 }

    - name: The released Pane was left alone
      if: always()
      shell: pwsh
      run: |
        $failed = $false
        # Logs for diagnosis (never config.json, which holds the saved token).
        New-Item -ItemType Directory -Force relay-evidence\logs | Out-Null
        Copy-Item -Recurse -ErrorAction SilentlyContinue "$HOME\.pane_cloudtest\logs" relay-evidence\logs\test-app
        Copy-Item -Recurse -ErrorAction SilentlyContinue C:\rc-fake-host\logs relay-evidence\logs\fake-host
        Copy-Item -ErrorAction SilentlyContinue C:\rc-fake-host\daemon.*.txt, C:\rc-fake-host\fake-tailscale\calls.log relay-evidence\logs\
        (Get-ChildItem -Force "$HOME\.pane").Name | Sort-Object | Set-Content relay-evidence\installed-after.txt
        (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' | Out-String) + (Get-ItemProperty 'HKCU:\Software\Classes\pane\shell\open\command' -ErrorAction SilentlyContinue | Out-String) | Set-Content relay-evidence\registry-after.txt
        $added = Compare-Object (Get-Content relay-evidence\installed-before.txt) (Get-Content relay-evidence\installed-after.txt) | Where-Object SideIndicator -eq '=>'
        if ($added) { Write-Host "FAIL new entries in ~\.pane: $($added.InputObject -join ', ')"; $failed = $true } else { Write-Host 'PASS ~\.pane has no new entries' }
        if ((Get-Content -Raw relay-evidence\registry-before.txt) -ne (Get-Content -Raw relay-evidence\registry-after.txt)) { Write-Host 'FAIL login item or pane:// handler changed'; $failed = $true } else { Write-Host 'PASS login item and pane:// handler unchanged' }
        $installedExe = "$env:LOCALAPPDATA\Programs\Pane\Pane.exe"
        if (Get-Process -Name Pane -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $installedExe }) { Write-Host 'PASS released Pane still running' } else { Write-Host 'FAIL released Pane not running'; $failed = $true }
        powershell -NoProfile -ExecutionPolicy Bypass -File "$HOME\PaneCloudTest\kit\remove.ps1"
        if ((Test-Path "$HOME\PaneCloudTest") -or (Test-Path "$HOME\.pane_cloudtest")) { Write-Host 'FAIL remove.ps1 left files'; $failed = $true } else { Write-Host 'PASS remove.ps1 removed the test build and its data' }
        if (Test-Path $installedExe) { Write-Host 'PASS released Pane still installed after remove.ps1' } else { Write-Host 'FAIL released Pane gone'; $failed = $true }
        if ($failed) { exit 1 }

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: relay-proof
        path: relay-evidence
        if-no-files-found: warn
