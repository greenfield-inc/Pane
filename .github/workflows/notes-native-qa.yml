name: Notes Native QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/src/components/panels/notes/**'
      - 'frontend/src/components/notes/**'
      - 'main/src/ipc/notes.ts'
      - 'main/src/services/note*.ts'
      - 'main/src/services/cursorNoteHook.ts'
      - 'main/src/services/sessionManager.ts'
      - 'shared/types/notes.ts'
      - 'scripts/notes-native-qa.cjs'
      - '.github/workflows/notes-native-qa.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: notes-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-notes:
    name: Notes Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pinned: Playwright 1.54.1 cannot install dependencies on Ubuntu 26.04
        # (ubuntu-latest).
        os: [ubuntu-24.04, windows-2022]
    env:
      AGENT_FARM_ARTIFACT_BUNDLE: ${{ github.workspace }}/tmp/greenfield/pane-notes
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Prepare evidence directory
        shell: bash
        run: mkdir -p "$AGENT_FARM_ARTIFACT_BUNDLE/evidence/native/build"
      - name: Install dependencies
        shell: bash
        # No install scripts: the next step builds SQLite for Electron once.
        run: pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee "$AGENT_FARM_ARTIFACT_BUNDLE/evidence/native/build/install.log"
      # SQLite built for Electron depends only on the OS, arch, Electron
      # version and the module's own version, so it is cached on those and
      # rebuilt only on a miss (no Electron 43 prebuilt exists to download).
      - name: Key the Electron SQLite build
        id: sqlite
        shell: bash
        run: |
          electron="$(node -p "require('./node_modules/electron/package.json').version")"
          module="$(node -p "require('./main/node_modules/better-sqlite3-multiple-ciphers/package.json').version")"
          echo "key=electron-sqlite-${{ runner.os }}-${{ runner.arch }}-electron${electron}-module${module}" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron SQLite build
        id: sqlite-cache
        uses: actions/cache@v5
        with:
          path: node_modules/.pnpm/better-sqlite3-multiple-ciphers@*/node_modules/better-sqlite3-multiple-ciphers/build/Release/better_sqlite3.node
          key: ${{ steps.sqlite.outputs.key }}
      - name: Build Electron native modules
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        shell: bash
        run: pnpm electron:rebuild 2>&1 | tee "$AGENT_FARM_ARTIFACT_BUNDLE/evidence/native/build/native-build.log"
      - name: Build application
        shell: bash
        run: |
          pnpm build:main 2>&1 | tee "$AGENT_FARM_ARTIFACT_BUNDLE/evidence/native/build/main.log"
          pnpm build:frontend 2>&1 | tee "$AGENT_FARM_ARTIFACT_BUNDLE/evidence/native/build/frontend.log"
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: pnpm exec playwright install-deps chromium
      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Electron 42+ fetches its binary on first use and logs that to stdout,
          # so fetch it first to keep require('electron') printing only the path.
          node node_modules/electron/install.js
          electron_path="$(node -p "require('electron')")"
          sudo chown root "$(dirname "$electron_path")/chrome-sandbox"
          sudo chmod 4755 "$(dirname "$electron_path")/chrome-sandbox"
      - name: Run native Linux journey
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/notes-native-qa.cjs
      - name: Run native Windows journey
        if: runner.os == 'Windows'
        run: node scripts/notes-native-qa.cjs
      - name: Upload screenshots, traces and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notes-native-${{ matrix.os }}-${{ github.sha }}
          path: tmp/greenfield/pane-notes/evidence/native/
          if-no-files-found: warn
          retention-days: 14
