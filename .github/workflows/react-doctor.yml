# React Doctor reports only newly introduced React findings on pull requests.
name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The scan covers only changed files under frontend/.
    paths:
      - 'frontend/**'
      - '.github/workflows/react-doctor.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        # Pane starts with 477 existing diagnostics. Changed-scope reporting is
        # advisory so this workflow identifies regressions without gating debt.
        with:
          version: '0.9.2'
          node-version: '22.18.0'
          directory: frontend
          scope: changed
          blocking: none
          comment: true
          review-comments: true
          commit-status: true
