name: Native Android Build

# Builds the Expo app's Android dev client with the real Firebase config, so
# push-capable Android builds work on any machine, not only where
# native/google-services.json happens to exist.
#
# The debug APK carries no JavaScript, so only native code can change it. A PR
# or a push to main builds when the Expo Android fingerprint
# (native/fingerprint.config.js) differs from the base (the PR's base, or the
# commit before the push), or this workflow changed. A PR builds one ABI
# (arm64-v8a) as a compile check; pushes build all four. The weekly run and
# manual runs always build all four, so the full build stays covered and the
# Gradle cache stays warm.
on:
  push:
    branches: [ main ]
    paths: [ 'native/**', 'pnpm-lock.yaml', '.github/workflows/native-android.yml', 'scripts/ci-native-fingerprint.sh' ]
  pull_request:
    # shared/ is not a fingerprint input, but the native app imports it, so a
    # shared/ change runs the cheap fingerprint job, which says why it skips.
    paths: [ 'native/**', 'shared/**', 'pnpm-lock.yaml', '.github/workflows/native-android.yml', 'scripts/ci-native-fingerprint.sh' ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  fingerprint:
    name: Android fingerprint
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.compare.outputs.build }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Fingerprint the head and the base
      if: github.event.before != '0000000000000000000000000000000000000000'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: scripts/ci-native-fingerprint.sh "$BASE_SHA" android

    - name: Compare
      id: compare
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
          reason="This push has no previous commit to compare with; building the APK."
          build=true
        elif ! git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/native-android.yml scripts/ci-native-fingerprint.sh; then
          reason="This change touches the Android build workflow; building the APK."
          build=true
        elif cmp -s "$RUNNER_TEMP/base-android" "$RUNNER_TEMP/head-android"; then
          reason="The Android fingerprint is unchanged ($(cat "$RUNNER_TEMP/head-android")), so this change cannot change the APK; skipping the build."
          build=false
        else
          reason="The Android fingerprint changed ($(cat "$RUNNER_TEMP/base-android") -> $(cat "$RUNNER_TEMP/head-android")); building the APK."
          build=true
        fi
        echo "$reason"
        echo "$reason" >> "$GITHUB_STEP_SUMMARY"
        echo "build=$build" >> "$GITHUB_OUTPUT"

  # One job per ABI, side by side. A PR build is a compile check, so it builds
  # arm64-v8a only.
  android:
    name: Android dev client (${{ matrix.abi }})
    needs: fingerprint
    # The fingerprint job is skipped outside PRs; those always build.
    if: ${{ !cancelled() && (needs.fingerprint.result == 'skipped' || needs.fingerprint.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64-v8a"]' || '["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    # Caches the Gradle user home (dependencies, wrapper, compiled build logic)
    # and serves the Gradle build cache. Only main writes the cache; PRs read
    # main's. The build cache is keyed by task inputs, so it never serves
    # output built from other sources.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    # google-services.json is gitignored. The secret holds it base64-encoded.
    # Fork PRs get no secrets and build without FCM (app.config.js skips it).
    - name: Write Firebase Android config
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.PANE_ANDROID_GOOGLE_SERVICES_JSON }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          if [ "$IS_FORK" = true ]; then echo "::notice::No Firebase config for fork PRs; building without FCM."; exit 0; fi
          echo "::error::PANE_ANDROID_GOOGLE_SERVICES_JSON is not set (see native/README.md)."; exit 1
        fi
        printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > native/google-services.json
        jq -e '[.client[].client_info.android_client_info.package_name] | index("com.dcouple.pane.mobile")' native/google-services.json > /dev/null 2>&1 \
          || { echo "::error::PANE_ANDROID_GOOGLE_SERVICES_JSON is not a google-services.json for com.dcouple.pane.mobile."; exit 1; }

    - name: Generate Android project
      working-directory: native
      run: pnpm exec expo prebuild --platform android --no-install

    - name: Build debug APK
      working-directory: native/android
      run: ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ matrix.abi }}
