name: Build & Release
# Manual runs name their publish and sign choices, so a dry run's history
# (and scripts/ci-timings.mjs) shows whether it signed.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build & Release {0} (publish={1}, sign={2})', inputs.release_tag, inputs.publish, inputs.sign) || format('Build & Release {0}', github.ref_name) }}

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases'
        type: boolean
        default: false
      release_tag:
        description: 'Existing vX.Y.Z tag to recover (required when publishing manually)'
        type: string
        required: true
      sign:
        description: 'Sign and notarize the macOS app (turn off for a dry run)'
        type: boolean
        default: true

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
  PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish == true }}
  # Tag and branch pushes always sign; only a manual dry run can turn it off.
  # A publishing run always signs (its build jobs refuse sign=false).
  SIGN: ${{ github.event_name != 'workflow_dispatch' || inputs.sign == true || inputs.publish == true }}
  # Manual dry runs keep their artifacts for a day, long enough to check them.
  ARTIFACT_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != true && 1 || 30 }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each macOS arch builds, signs and notarizes in its own job and never
          # publishes; the publish job merges latest-mac.yml and uploads.
          - os: macos-latest
            artifact: macos-arm64
            release_cmd: build:mac:arm64
            ci_cmd: build:mac:arm64
            artifact_path: |
              dist-electron/*.dmg
              dist-electron/*.zip
              dist-electron/*.blockmap
              dist-electron/latest-mac.yml
          - os: macos-latest
            artifact: macos-x64
            release_cmd: build:mac:x64
            ci_cmd: build:mac:x64
            artifact_path: |
              dist-electron/*.dmg
              dist-electron/*.zip
              dist-electron/*.blockmap
              dist-electron/latest-mac.yml
          - os: ubuntu-latest
            artifact: ubuntu-latest
            release_cmd: release:linux:x64
            ci_cmd: build:linux:x64
            artifact_path: |
              dist-electron/*.deb
              dist-electron/*.AppImage
              dist-electron/latest-linux.yml
          - os: ubuntu-24.04-arm
            artifact: ubuntu-24.04-arm
            release_cmd: release:linux:arm64
            ci_cmd: build:linux:arm64
            artifact_path: |
              dist-electron/*.deb
              dist-electron/*.AppImage
              dist-electron/latest-linux-arm64.yml

    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Refuse to publish an unsigned release
      if: inputs.publish == true && inputs.sign == false
      run: |
        echo "::error::publish=true needs sign=true: a published macOS release must be signed and notarized. Run again with sign checked, or with publish unchecked for a dry run."
        exit 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    # macOS skips both caches: no workflow on main saves a macOS pnpm store or
    # Electron cache, so a tag run never restores one, and saving the store
    # cost 63-85 s per release. Electron's macOS cache is not ~/.cache anyway.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
        cache: ${{ runner.os != 'macOS' && 'pnpm' || '' }}

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      if: runner.os != 'macOS'
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-electron-

    # Ubuntu 26.04's GCC defaults to -march=x86-64-v3 (AVX2, BMI2), so native
    # modules built from source crash with SIGILL on older x86-64 CPUs (#1226).
    - name: Target the generic x86-64 baseline for native modules
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo 'CFLAGS=-march=x86-64 -mtune=generic' >> "$GITHUB_ENV"
        echo 'CXXFLAGS=-march=x86-64 -mtune=generic' >> "$GITHUB_ENV"

    # On macOS, electron-builder rebuilds the native modules for each target
    # arch while packaging (npmRebuild), so the install-time rebuild for the
    # host arch is skipped there.
    # afterPack builds the pane-direct helper (direct/) for each packaged arch.
    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal && rustup default stable

    - run: pnpm install ${{ runner.os == 'macOS' && '--ignore-scripts' || '' }}

    - name: Patch electron-builder temporary keychain password handling
      if: runner.os == 'macOS'
      run: node scripts/patch-electron-builder-macos-keychain.js

    - name: Verify release target
      if: github.ref_type == 'tag' || inputs.publish == true
      run: |
        expected_tag="v$(node -p 'require("./package.json").version')"
        test "$RELEASE_TAG" = "$expected_tag"
        git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"

    - name: Build and optionally publish
      run: |
        # electron-builder signs whenever CSC_LINK is set, even to an empty
        # string, so a dry run without signing removes the variables.
        if [[ "$SIGN" != "true" ]]; then
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
        fi
        if [[ "$PUBLISH" == "true" ]]; then
          echo "Release build — publishing to GitHub Releases"
          pnpm run ${{ matrix.release_cmd }}
        else
          echo "CI build — artifacts only"
          pnpm run ${{ matrix.ci_cmd }}
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGN == 'true' && runner.os == 'macOS' && secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        CSC_DISABLE: ${{ env.SIGN != 'true' || runner.os != 'macOS' || secrets.CSC_LINK == '' || secrets.CSC_KEY_PASSWORD == '' || secrets.APPLE_ID == '' || secrets.APPLE_TEAM_ID == '' || secrets.APPLE_APP_SPECIFIC_PASSWORD == '' }}

    - run: ls -la dist-electron/

    - name: Verify packaged headless remote setup
      if: runner.os == 'Linux'
      shell: bash
      run: |
        case "$(uname -m)" in
          x86_64) appimage_pattern='*x86_64.AppImage' ;;
          aarch64|arm64) appimage_pattern='*arm64.AppImage' ;;
          *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 2 ;;
        esac
        appimage="$(find dist-electron -maxdepth 1 -name "$appimage_pattern" -print -quit)"
        scripts/test-packaged-headless-remote-setup.sh "$appimage"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pane-${{ matrix.artifact }}-${{ env.RELEASE_TAG }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_DAYS }}

  # One job after every build: merges the macOS and Windows updater files,
  # computes the checksums, then uploads and publishes. Dry runs stop after the
  # merge and checksums and keep them as an artifact to check.
  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
    # The merge scripts need js-yaml. Installing only the root package from the
    # lockfile, without install scripts, keeps every version pinned and runs
    # no package code in a job that can write the release.
    - name: Install the root package for the merge scripts
      run: pnpm install --frozen-lockfile --ignore-scripts --filter .

    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pane-windows-x64-${{ env.RELEASE_TAG }}
        path: windows-artifacts/x64
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pane-windows-arm64-${{ env.RELEASE_TAG }}
        path: windows-artifacts/arm64
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pane-macos-arm64-${{ env.RELEASE_TAG }}
        path: mac-artifacts/arm64
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: pane-macos-x64-${{ env.RELEASE_TAG }}
        path: mac-artifacts/x64
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pane-ubuntu-*-${{ env.RELEASE_TAG }}
        path: release-files
        merge-multiple: true

    - name: Merge macOS updater metadata
      run: |
        mkdir -p mac-release
        for arch in arm64 x64; do
          cp mac-artifacts/$arch/*-macOS-$arch.{zip,dmg,zip.blockmap,dmg.blockmap} mac-release/
        done
        node scripts/merge-mac-latest.js \
          mac-artifacts/arm64/latest-mac.yml \
          mac-artifacts/x64/latest-mac.yml \
          mac-release/latest-mac.yml
        cp mac-release/* release-files/

    - name: Merge Windows updater metadata
      run: |
        mkdir -p windows-release
        cp windows-artifacts/x64/*-Windows-x64.exe windows-release/
        cp windows-artifacts/x64/*-Windows-x64.exe.blockmap windows-release/
        cp windows-artifacts/arm64/*-Windows-arm64.exe windows-release/
        cp windows-artifacts/arm64/*-Windows-arm64.exe.blockmap windows-release/
        node scripts/merge-windows-latest.js \
          windows-artifacts/x64/latest.yml \
          windows-artifacts/arm64/latest.yml \
          windows-release/latest.yml
        cp windows-release/* release-files/
        ls -la release-files

    # The same installers the release carries, so the sums match its assets.
    - name: Compute SHA256
      run: |
        mkdir -p checksums
        cd release-files
        mapfile -t installers < <(printf '%s\n' *.exe *.dmg *.zip *.deb *.AppImage | sort)
        sha256sum "${installers[@]}" > ../checksums/SHA256SUMS.txt
        cat ../checksums/SHA256SUMS.txt
        python3 - <<'PY'
        import hashlib, json, os, pathlib
        names = sorted(p.name for p in pathlib.Path('.').iterdir()
                       if p.is_file() and p.suffix in {'.exe', '.dmg', '.zip', '.deb', '.AppImage'})
        artifacts = [{"name": n, "sha256": hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest()}
                     for n in names]
        pathlib.Path('../checksums/continuity.json').write_text(json.dumps({
            "protocol": 1, "version": os.environ['RELEASE_TAG'].removeprefix('v'),
            "artifacts": artifacts,
        }, indent=2) + '\n')
        PY

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-metadata-${{ env.RELEASE_TAG }}
        path: |
          checksums/*
          release-files/*.yml
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_DAYS }}

    - name: Upload macOS and Windows assets and checksums
      if: env.PUBLISH == 'true'
      run: |
        gh release upload "$RELEASE_TAG" mac-release/* windows-release/* checksums/SHA256SUMS.txt checksums/continuity.json \
          --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish GitHub Release
      if: env.PUBLISH == 'true'
      run: bash scripts/publish-github-release.sh "${{ github.repository }}" "$RELEASE_TAG"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # pane-relay for each platform runpane's npm package ships it on, one
  # @runpane/relay-<platform>-<arch> package each (scripts/runpane-relay-packages.js).
  # Runs on every build, so the release branch check catches a broken cross build.
  build-relay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: darwin-x64, os: macos-latest }
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: win32-x64, os: windows-2022 }
          - { platform: win32-arm64, os: windows-2022 }
    name: build-relay (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal && rustup default stable
    # Linux binaries link musl statically, so they run on any distribution.
    - name: Install musl
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - run: node scripts/runpane-relay-packages.js build ${{ matrix.platform }} relay-bin
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pane-relay-${{ matrix.platform }}-${{ env.RELEASE_TAG }}
        path: relay-bin
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_DAYS }}

  validate-runpane-packages:
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: build-relay
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
        cache: 'pnpm'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - run: pnpm install --filter runpane --ignore-scripts
    - run: pnpm run check:runpane-package-versions
    - run: pnpm --filter runpane build
    - run: pnpm run test:runpane-contract
    - run: pnpm run test:runpane-mcp
    - run: pnpm run test:runpane-workspace
    - run: pnpm run test:runpane-handoff
    - run: pnpm run test:runpane-managed-cli
    - run: pnpm run test:runpane-telemetry
    - run: pnpm run test:runpane-package-smoke
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pane-relay-*-${{ env.RELEASE_TAG }}
        path: relay-bin
        merge-multiple: true
    - name: Check that every relay package packs its binary, without publishing
      run: node scripts/runpane-relay-packages.js stage relay-bin "$RUNNER_TEMP/relay-npm"
    - name: Run runpane relay on this release's Linux binary
      run: node --test scripts/test-runpane-relay.js
      env:
        PANE_RELAY_BIN: ${{ github.workspace }}/relay-bin/linux-x64/pane-relay

  publish-npm:
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: [publish, validate-runpane-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
        cache: 'pnpm'
    - name: Ensure npm supports trusted publishing
      run: npm install -g npm@^11.5.1
    - run: pnpm install --filter runpane --ignore-scripts
    - run: pnpm --filter runpane build
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pane-relay-*-${{ env.RELEASE_TAG }}
        path: relay-bin
        merge-multiple: true
    # The relay packages go first, so runpane never names a version npm lacks.
    # A recovery run skips the ones this version already published.
    - name: Publish the relay packages to npm
      run: |
        node scripts/runpane-relay-packages.js stage relay-bin "$RUNNER_TEMP/relay-npm"
        if [[ -n "$NPM_TOKEN" ]]; then
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        fi
        for dir in "$RUNNER_TEMP"/relay-npm/*/; do
          id="$(cd "$dir" && node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$id" version >/dev/null 2>&1; then
            echo "$id is already on npm"
            continue
          fi
          (cd "$dir" && npm publish --provenance --access public)
        done
    - name: List the relay packages as runpane's optional dependencies
      run: node scripts/runpane-relay-packages.js pin
    - name: Publish runpane to npm with token fallback
      if: ${{ env.NPM_TOKEN != '' }}
      working-directory: packages/runpane
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ env.NPM_TOKEN }}" > .npmrc
        npm publish --access public
    - name: Publish runpane to npm with trusted publishing
      if: ${{ env.NPM_TOKEN == '' }}
      working-directory: packages/runpane
      run: npm publish --provenance --access public

  publish-pypi:
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: [publish, validate-runpane-packages]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/runpane
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.11'
    - name: Build Python distribution
      run: |
        python -m pip install --upgrade build
        python -m build packages/runpane-py
    - name: Publish runpane to PyPI with token fallback
      if: ${{ env.PYPI_API_TOKEN != '' }}
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: packages/runpane-py/dist
        password: ${{ env.PYPI_API_TOKEN }}
    - name: Publish runpane to PyPI with trusted publishing
      if: ${{ env.PYPI_API_TOKEN == '' }}
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: packages/runpane-py/dist

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22.23.4'
        cache: 'pnpm'
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: windows-${{ matrix.arch }}-electron-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: windows-${{ matrix.arch }}-electron-
    # afterPack builds the pane-direct helper (direct/) for each packaged arch.
    - name: Set up Rust
      run: rustup toolchain install stable --profile minimal && rustup default stable

    - run: pnpm install

    - name: Build Windows artifact
      run: |
        Write-Host "Building Windows ${{ matrix.arch }} artifact without publishing"
        node scripts/build-win.js ${{ matrix.arch }}

    - run: dir dist-electron

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pane-windows-${{ matrix.arch }}-${{ env.RELEASE_TAG }}
        path: |
          dist-electron/*-Windows-${{ matrix.arch }}.exe
          dist-electron/*-Windows-${{ matrix.arch }}.exe.blockmap
          dist-electron/latest.yml
        if-no-files-found: error
        retention-days: ${{ env.ARTIFACT_DAYS }}

  # Renders the Homebrew cask and winget manifests from this run's macOS and
  # Windows artifacts. Runs on dry runs too, so the rendered files can be
  # checked before a release.
  packaging:
    needs: [build, build-windows]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pane-macos-*-${{ env.RELEASE_TAG }}
        path: release-files
        merge-multiple: true
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pane-windows-*-${{ env.RELEASE_TAG }}
        path: release-files
        merge-multiple: true
    - name: Render packaging files
      run: |
        (cd release-files && shasum -a 256 -- *.dmg *.exe) > SHA256SUMS
        scripts/render-packaging.sh "$(node -p 'require("./package.json").version')" SHA256SUMS rendered
    - name: Audit Homebrew cask
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: |
        brew tap-new --no-git local/pane
        brew trust --tap local/pane
        tap="$(brew --repository local/pane)"
        mkdir -p "$tap/Casks"
        cp rendered/homebrew/Casks/pane.rb "$tap/Casks/"
        brew style --cask local/pane/pane
        brew audit --cask --strict local/pane/pane
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: packaging-${{ env.RELEASE_TAG }}
        path: rendered
        if-no-files-found: error
        retention-days: 90

  homebrew:
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: [packaging, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: packaging-${{ env.RELEASE_TAG }}
        path: rendered
    - name: Push the cask to greenfield-inc/homebrew-tap
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::notice::Skipping the Homebrew tap update: HOMEBREW_TAP_TOKEN is not set."
          exit 0
        fi
        git clone "https://x-access-token:$TAP_TOKEN@github.com/greenfield-inc/homebrew-tap.git" tap
        cp -R rendered/homebrew/. tap/
        cd tap
        git add Casks
        if git diff --cached --quiet; then
          echo "The tap already has this cask."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "pane $RELEASE_TAG"
        git push

  notify-website:
    if: github.ref_type == 'tag' || inputs.publish == true
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to runpane-website
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.SITE_REPO_DISPATCH_TOKEN }}
          repository: parsakhaz/runpane-website
          event-type: pane-release
