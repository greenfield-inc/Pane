name: Code Quality

on:
  push:
    branches: [ main ]
  # Stacked and integration PRs need the same gates before they reach main.
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's in-flight run. Every other event gets
# its own group, so no main commit ever loses its run.
concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      runpane: ${{ steps.filter.outputs.runpane }}
      main: ${{ steps.filter.outputs.main }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Filter changed paths
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          runpane:
            - 'packages/runpane/**'
            - 'packages/runpane-py/**'
            - 'contracts/runpane/**'
            - 'shared/types/runpaneOrchestration.ts'
            - 'shared/types/generatedRunpaneContract.ts'
            - 'scripts/generate-runpane-contract.js'
            - 'scripts/sync-runpane-package-versions.js'
            - 'scripts/test-runpane-contract.js'
            - 'scripts/test-runpane-node-runtime.js'
            - 'scripts/test-runpane-mcp.js'
            - 'scripts/test-runpane-package-smoke.js'
            - 'scripts/test-runpane-workspace.js'
            - 'scripts/test-runpane-handoff.js'
            - 'scripts/test-runpane-managed-cli.js'
            - 'scripts/fixtures/**'
            - '.github/workflows/quality.yml'
          main:
            - 'main/**'
            - 'shared/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.github/workflows/quality.yml'

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    # Skip the Electron-targeted postinstall rebuild; the Node rebuild below
    # builds the only native module these tests load.
    - name: Install dependencies
      run: pnpm install --ignore-scripts

    - name: Verify GitHub release publication behavior
      run: bash scripts/test-publish-github-release.sh

    - name: Verify macOS updater metadata merge
      run: node scripts/test-merge-mac-latest.js

    # The unit tests load the real electron package (main/src/utils/shellPath.ts).
    - name: Fetch Electron
      uses: ./.github/actions/fetch-electron

    - name: Rebuild native modules for Node tests
      run: pnpm rebuild better-sqlite3-multiple-ciphers

    # CI retries a failed unit test once; the retry report lists every retried
    # test in the job summary, so flaky tests stay visible (--retry, see
    # CONTRIBUTING.md). Playwright journeys are never retried.
    - name: Run main process test suite
      run: CI=1 pnpm --filter main exec vitest run --retry=1 --reporter=default --reporter=../scripts/vitest-retry-report.mjs

    - name: Run frontend unit tests
      run: CI=1 pnpm --filter frontend exec vitest run --retry=1 --reporter=default --reporter=../scripts/vitest-retry-report.mjs

    - name: Run Pane Cloud contract tests
      run: pnpm --filter pane-cloud-contract test

    - name: Check Pane Cloud contract build is committed
      if: ${{ !cancelled() }}
      run: |
        pnpm --filter pane-cloud-contract run check:dist || {
          echo "::error title=pane-cloud-contract dist drift::packages/pane-cloud-contract/dist differs from its source. Run: pnpm --filter pane-cloud-contract build and commit dist."
          exit 1
        }

    # Catches hand edits to the generated contract files (docs, TS, Python,
    # fixture). It needs no dependencies, and runs even if the tests above
    # failed so it never hides behind them.
    - name: Check runpane contract generated files
      if: ${{ !cancelled() }}
      run: |
        node scripts/generate-runpane-contract.js --check || {
          echo "::error title=runpane contract drift::Generated runpane contract files differ from contracts/runpane/contract.json. Edit contract.json, not the generated files, then run: node scripts/generate-runpane-contract.js and commit the result."
          exit 1
        }

  # Type checking and lint get their own runner: beside the unit tests they
  # competed for its CPUs and slowed the tests by about 30s. They run in
  # parallel here; the Finish steps print each output and fail on errors.
  typecheck-lint:
    name: Type Check and Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install --ignore-scripts

    - name: Start type checking
      run: scripts/ci-background.sh start typecheck pnpm typecheck

    - name: Start consolidated lint harness
      run: scripts/ci-background.sh start lint pnpm lint

    - name: Finish type checking
      if: ${{ !cancelled() }}
      run: scripts/ci-background.sh wait typecheck

    - name: Finish consolidated lint harness
      if: ${{ !cancelled() }}
      run: scripts/ci-background.sh wait lint

  # Offline check of relative links and #anchors in every tracked markdown file.
  # External URLs are not fetched, so the check never flakes on the network.
  markdown-links:
    name: Markdown Links
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The action downloads lychee from GitHub's releases, which fail for hours
    # at a time, so a failed first try runs once more. A broken link fails both.
    - name: Check markdown links
      id: links
      continue-on-error: true
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --offline --include-fragments --no-progress
          --exclude-path node_modules --exclude-path dist-electron
          './**/*.md'
        fail: true

    - name: Wait before checking links again
      if: steps.links.outcome == 'failure'
      run: sleep 20

    - name: Check markdown links again
      if: steps.links.outcome == 'failure'
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --offline --include-fragments --no-progress
          --exclude-path node_modules --exclude-path dist-electron
          './**/*.md'
        fail: true

  # The smoke suites run beside quality-checks in three jobs. The two browser
  # shards split the minimal suite, which loads the renderer from Vite with a
  # mocked Electron API. The Electron job runs the renderer selection races
  # (also Vite) while better-sqlite3 rebuilds for Electron, then the journeys
  # that launch main/dist in real Electron.
  # Pinned: ubuntu-latest is Ubuntu 26.04, which Playwright 1.54.1 cannot
  # install browser dependencies for. Move back once Playwright supports it.
  functional-smoke-browser:
    name: Functional Smoke (browser ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install --ignore-scripts

    - name: Install Playwright browser dependencies
      run: pnpm exec playwright install --with-deps chromium

    - name: Run maintained functional smoke tests
      run: pnpm test:ci:minimal --shard=${{ matrix.shard }}/2

  functional-smoke-electron:
    name: Functional Smoke (Electron)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    - name: Install dependencies
      run: pnpm install --ignore-scripts

    # The browser download and apt packages overlap the build steps below.
    # apt upgrades libraries Electron loads, so the wait step comes before
    # Electron first starts.
    - name: Start Playwright browser dependencies install
      run: scripts/ci-background.sh start playwright pnpm exec playwright install --with-deps chromium

    # The install skipped Electron's binary download, and Electron 42+ logs a
    # first-use fetch to stdout, so fetch it first to keep require('electron')
    # printing only the path.
    - name: Fetch Electron
      uses: ./.github/actions/fetch-electron

    - name: Start native module rebuild for Electron
      run: scripts/ci-background.sh start electron-rebuild pnpm run electron:rebuild

    - name: Configure Electron sandbox
      run: |
        electron_path="$(node -p "require('electron')")"
        electron_dir="$(dirname "${electron_path}")"
        sudo chown root "${electron_dir}/chrome-sandbox"
        sudo chmod 4755 "${electron_dir}/chrome-sandbox"

    - name: Build main process
      run: pnpm build:main

    - name: Finish Playwright browser dependencies install
      run: scripts/ci-background.sh wait playwright

    # Needs no native module, so the rebuild finishes behind it; only the
    # Electron launches below wait for it.
    - name: Verify renderer selection races
      run: pnpm test:renderer-selection
      env:
        PANE_DIR: ${{ runner.temp }}/pane-renderer-selection

    - name: Finish native module rebuild for Electron
      if: ${{ !cancelled() }}
      run: scripts/ci-background.sh wait electron-rebuild

    - name: Verify sandboxed Electron preload
      if: ${{ !cancelled() }}
      run: xvfb-run -a pnpm exec electron scripts/smoke-sandboxed-preload.cjs

    # Launches Electron from the build above with a scripted ACP agent; never a real account.
    - name: Run chat tab journeys
      if: ${{ !cancelled() }}
      run: xvfb-run -a pnpm test:chat-tabs
      env:
        PANE_DIR: ${{ runner.temp }}/pane-chat-tabs

  # Published wrapper CLIs (npm + PyPI). Runs only when wrapper/contract files
  # change on a PR; always runs on pushes to main. Each OS is tested once at
  # the runtime floors (Node 22.23.4 / Python 3.8) and once at current (Node 24.22.1 /
  # Python 3.13) instead of the full Node x Python cross product. The Linux
  # floor entry runs on ubuntu-24.04. It was pinned there because setup-python
  # has no Python 3.8 build for Ubuntu 26.04 (ubuntu-latest); uv now installs
  # 3.8, so that reason no longer applies.
  runpane-wrapper-tests:
    name: Runpane Wrapper (${{ matrix.os }}, Node ${{ matrix.node-version }}, Python ${{ matrix.python-version }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.runpane == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node-version: '22.23.4', python-version: '3.8' }
          - { os: ubuntu-latest, node-version: '24.22.1', python-version: '3.13' }
          - { os: macos-latest, node-version: '22.23.4', python-version: '3.8' }
          - { os: macos-latest, node-version: '24.22.1', python-version: '3.13' }
          - { os: windows-2022, node-version: '22.23.4', python-version: '3.8' }
          - { os: windows-2022, node-version: '24.22.1', python-version: '3.13' }

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm
      with:
        node-version: ${{ matrix.node-version }}

    # Python 3.8 is not preinstalled on macOS or Windows runners, and
    # setup-python took 31-56 s to fetch it there. uv installs its standalone
    # CPython build in a few seconds. The test scripts read PYTHON.
    - name: Setup Python
      if: matrix.python-version != '3.8'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv for Python 3.8
      if: matrix.python-version == '3.8'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # A pinned uv, so a new uv release can't change the required jobs.
        version: '0.13.7'
        # Nothing here reuses uv's package cache.
        enable-cache: false

    - name: Install Python 3.8 with uv
      if: matrix.python-version == '3.8'
      shell: bash
      run: |
        uv python install 3.8
        python="$(uv python find 3.8)"
        "$python" --version
        echo "PYTHON=$python" >> "$GITHUB_ENV"
        "$python" -c "import os, sys; print(os.path.dirname(sys.executable))" >> "$GITHUB_PATH"

    - name: Install wrapper dependencies
      run: pnpm install --filter runpane --ignore-scripts

    - name: Check wrapper package versions
      run: node scripts/sync-runpane-package-versions.js --check

    - name: Build npm wrapper
      run: pnpm --filter runpane build

    # Packing runs runpane's prepack, which rebuilds dist/, so the package
    # smoke tests run before anything else reads dist/.
    - name: Run package manager smoke tests
      run: node scripts/test-runpane-package-smoke.js

    # The two slow suites (about 95 and 120 s on Windows) use their own temp
    # directories, so they run in the background beside the short ones. Each
    # Finish step prints that suite's output and fails with it.
    - name: Start wrapper contract tests
      shell: bash
      run: scripts/ci-background.sh start contract node scripts/test-runpane-contract.js

    - name: Start handoff tests
      shell: bash
      run: scripts/ci-background.sh start handoff node --test scripts/test-runpane-handoff.js

    - name: Check patched Node runtime guard
      run: node --test scripts/test-runpane-node-runtime.js

    - name: Run MCP server tests
      run: node --test scripts/test-runpane-mcp.js

    - name: Run workspace routing tests
      run: node --test scripts/test-runpane-workspace.js

    - name: Run managed CLI hand-off tests
      run: node --test scripts/test-runpane-managed-cli.js

    - name: Run wrapper telemetry tests
      run: node --test scripts/test-runpane-telemetry.js

    - name: Finish wrapper contract tests
      if: ${{ !cancelled() }}
      shell: bash
      run: scripts/ci-background.sh wait contract

    - name: Finish handoff tests
      if: ${{ !cancelled() }}
      shell: bash
      run: scripts/ci-background.sh wait handoff

  # Ubuntu is already covered by quality-checks above; this job only adds the
  # other platforms, and only when main-process code (or its deps) changed.
  # Windows runs the suite in two vitest shards, each about half of it. macOS
  # runs it whole: the org has 5 macOS runners, and a second macOS job waited
  # longer for one than the shard saved.
  cross-os-main-tests:
    name: Main Process Tests (${{ matrix.os }}${{ matrix.shards > 1 && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.main == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, shard: 1, shards: 1 }
          - { os: windows-2022, shard: 1, shards: 2 }
          - { os: windows-2022, shard: 2, shards: 2 }

    steps:
    # The default Windows TEMP is on the runner's slow C: drive; the database
    # tests write SQLite files there. D: (RUNNER_TEMP) is several times faster.
    - name: Keep temp files on the workspace drive
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
        echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

    # Without this, Defender is still scanning the freshly installed packages
    # when the tests start, and it holds test worktrees open (EBUSY on cleanup).
    - name: Exclude temp files and workspace from Defender scanning
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js and pnpm
      uses: ./.github/actions/setup-pnpm

    # Skip the Electron-targeted postinstall rebuild; the Node rebuild below
    # builds the only native module these tests load.
    - name: Install dependencies
      run: pnpm install --ignore-scripts

    - name: Start main process type checking
      if: matrix.shard == 1
      shell: bash
      run: scripts/ci-background.sh start typecheck pnpm --filter main typecheck

    # The unit tests load the real electron package (main/src/utils/shellPath.ts);
    # without this, each test worker downloads Electron and they collide on Windows.
    - name: Fetch Electron
      uses: ./.github/actions/fetch-electron

    - name: Rebuild native modules for Node tests
      run: pnpm rebuild better-sqlite3-multiple-ciphers

    - name: Run main process unit tests
      run: pnpm --filter main exec vitest run --shard=${{ matrix.shard }}/${{ matrix.shards }} --retry=1 --reporter=default --reporter=../scripts/vitest-retry-report.mjs

    - name: Finish main process type checking
      if: ${{ !cancelled() && matrix.shard == 1 }}
      shell: bash
      run: scripts/ci-background.sh wait typecheck

  # The one check branch protection requires. Skipped jobs pass; failed or
  # cancelled ones fail it.
  ci-result:
    name: CI result
    needs: [changes, quality-checks, typecheck-lint, functional-smoke-browser, functional-smoke-electron, runpane-wrapper-tests, cross-os-main-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
