name: Probe setup cache (throwaway)

on:
  push:
    branches: [ci-setup-cache]

jobs:
  seed:
    name: Seed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
    - name: Exclude workspace from Defender scanning
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-pnpm
    - name: Install dependencies
      shell: bash
      run: |
        time pnpm install --frozen-lockfile --ignore-scripts
        du -sh node_modules || true
        find node_modules -type f | wc -l
    - name: Save node_modules
      uses: actions/cache/save@v5
      with:
        path: node_modules
        key: probe-nm-${{ runner.os }}-${{ github.run_id }}
    - name: Install Playwright browsers
      if: runner.os == 'Linux'
      run: pnpm exec playwright install chromium && du -sh ~/.cache/ms-playwright
    - name: Save Playwright browsers
      if: runner.os == 'Linux'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/ms-playwright
        key: probe-pw-${{ runner.os }}-${{ github.run_id }}

  restore:
    name: Restore (${{ matrix.os }}, ${{ matrix.n }})
    needs: seed
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        n: [1, 2, 3]
    steps:
    - name: Exclude workspace from Defender scanning
      if: runner.os == 'Windows'
      shell: pwsh
      run: Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-pnpm
    - name: Restore node_modules
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        key: probe-nm-${{ runner.os }}-${{ github.run_id }}
        fail-on-cache-miss: true
    - name: Verify install offline
      shell: bash
      run: time pnpm install --frozen-lockfile --ignore-scripts --offline
    - name: Restore Playwright browsers
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ms-playwright
        key: probe-pw-${{ runner.os }}-${{ github.run_id }}
        fail-on-cache-miss: true
    - name: Playwright install with browsers present
      if: runner.os == 'Linux'
      run: time pnpm exec playwright install chromium
    - name: Load-check the tree
      shell: bash
      run: node -e "require('vitest/package.json'); require('playwright/package.json'); console.log('ok')"
