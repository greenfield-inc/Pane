<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pair with Pane</title>
<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #18181b; --muted: #71717a; --line: #e4e4e7; --primary: #18181b; --on-primary: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f0f11; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33; --primary: #f4f4f5; --on-primary: #18181b; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { width: 100%; max-width: 360px; text-align: center; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
p { margin: 0 0 24px; color: var(--muted); }
a.btn { display: block; padding: 12px 16px; margin-top: 12px; border-radius: 10px; border: 1px solid var(--line);
  color: var(--fg); text-decoration: none; font-weight: 500; }
a.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
p.note { margin: 24px 0 0; font-size: 14px; }
p.note + p.note { margin-top: 12px; }
p.note a { color: var(--fg); font-weight: 500; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Pair with Pane</h1>
  <p id="status">Connect this device to your computer.</p>
  <div id="actions" hidden>
    <a class="btn primary" id="store" href="https://apps.apple.com/app/id6808839038" hidden>Get Pane on the App Store</a>
    <a class="btn primary" id="app" href="#">Open in Pane app</a>
    <a class="btn" id="web" href="#">Continue in browser</a>
    <p class="note" id="phone-note">No Pane app yet? The iPhone app is on the App Store.<br><a href="https://apps.apple.com/app/id6808839038" target="_blank" rel="noopener">Get Pane for iPhone</a></p>
    <p class="note" id="desktop-note" hidden>No Pane here yet? <a href="https://runpane.com" target="_blank" rel="noopener" id="download">Download Pane</a>, then open this link again.</p>
    <p class="note" id="once" hidden>This link works once.</p>
  </div>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.hash.slice(1));
  var secret = params.get("s") || "";
  var id = params.get("c") || "";
  var name = (params.get("n") || "").slice(0, 60);
  var title = document.getElementById("title");
  var status = document.getElementById("status");
  if (!secret || !/^[a-z2-7]{16}$/.test(id)) {
    status.textContent = "This pairing link is incomplete. Scan the QR code on your computer again.";
    return;
  }
  var app = document.getElementById("app");
  app.href = "pane://pair" + location.hash + "&d=" + encodeURIComponent(location.host);
  document.getElementById("web").href = "https://" + id + "." + location.host + "/app/#pair=" + encodeURIComponent(secret);
  var ua = navigator.userAgent;
  // A link tapped on an iPhone opens the installed app, so this page is for one without it.
  if (/iPhone|iPod/.test(ua)) {
    document.getElementById("store").hidden = false;
    app.classList.remove("primary");
    document.getElementById("phone-note").textContent = "After installing, come back here and tap Open in Pane app, or scan the code again.";
  }
  // A desktop browser hands the link to desktop Pane, which links this computer.
  var touchMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var desktop = !/Android|iPhone|iPad|iPod|Mobile/.test(ua) && !touchMac;
  if (desktop) {
    var os = /Windows/.test(ua) ? "Windows" : /Macintosh/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "";
    if (os) document.getElementById("download").textContent = "Download Pane for " + os;
    title.textContent = name ? "Link with " + name : "Link with Pane";
    status.textContent = "Opening Pane on this computer to finish linking.";
    app.textContent = "Open Pane";
    document.getElementById("phone-note").hidden = true;
    document.getElementById("desktop-note").hidden = false;
    document.getElementById("once").hidden = false;
  } else if (name) {
    title.textContent = "Pair with " + name;
  }
  document.getElementById("actions").hidden = false;
  if (desktop) location.href = app.href;
  fetch("/v1/status/" + id).then(function (r) { return r.json(); }).then(function (s) {
    if (s.state === "asleep") status.textContent = "Your computer is asleep. Wake it, then continue.";
    else if (s.state === "offline") status.textContent = "Your computer is offline. Open Pane on it, then continue.";
  }).catch(function () {});
})();
</script>
</body>
</html>
