# Create a Session, open it, pin and unpin it, archive it and restore it
# from Archived. Needs a dev host with Sessions (README).
appId: com.dcouple.pane.mobile
name: Session journeys
---
- runFlow: subflows/signed-in.yaml
- evalScript: ${output.session = 'mae-' + Date.now().toString(36)}

# New Session: name it and keep the host's default agent.
- tapOn:
    id: home-new
- tapOn:
    id: sessions-new
- extendedWaitUntil:
    visible:
      id: new-session-name
    timeout: 15000
# The sheet slides up to its detent; tapping mid-slide hits the wrong row.
- waitForAnimationToEnd
- tapOn:
    id: new-session-name
- inputText: ${output.session}
# Return submits the sheet (the keyboard covers the Create button).
- pressKey: Enter
# The Session opens on its agent chat.
- extendedWaitUntil:
    visible:
      id: pane-detail-screen
    timeout: 60000
- assertVisible: ".*${output.session}.*"
- swipe:
    start: 5%, 50%
    end: 90%, 50%
    duration: 400
- extendedWaitUntil:
    visible: "Open Session ${output.session}"
    timeout: 15000

# Swipe right and tap Pin: it shows under Pinned as well as Sessions.
# Every row's swipe actions stay mounted, so pick the one beside this row.
- swipe:
    from: "Open Session ${output.session}"
    direction: RIGHT
- tapOn:
    id: "session-swipe-pin-.*"
    leftOf: "Open Session ${output.session}"
- extendedWaitUntil:
    visible:
      id: "session-row-pinned:.*"
      text: "Open Session ${output.session}"
    timeout: 10000
# Unpin it from its row under Pinned, which sits above Sessions.
- swipe:
    from:
      id: "session-row-pinned:.*"
      text: "Open Session ${output.session}"
    direction: RIGHT
- tapOn:
    id: "session-swipe-pin-pinned:.*"
    leftOf:
      id: "session-row-pinned:.*"
      text: "Open Session ${output.session}"
- extendedWaitUntil:
    notVisible:
      id: "session-row-pinned:.*"
      text: "Open Session ${output.session}"
    timeout: 10000

# Swipe left and tap Archive: no confirm, as on desktop. Then restore it from Archived.
- swipe:
    from: "Open Session ${output.session}"
    direction: LEFT
- tapOn:
    id: "session-swipe-archive-.*"
    rightOf: "Open Session ${output.session}"
- extendedWaitUntil:
    notVisible: "Open Session ${output.session}"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: sidebar-section-archived
- runFlow:
    when:
      notVisible: "Restore Session ${output.session}"
    commands:
      - tapOn:
          id: sidebar-section-archived
- scrollUntilVisible:
    element: "Restore Session ${output.session}"
    timeout: 15000
- tapOn: "Restore Session ${output.session}"
- scrollUntilVisible:
    element: "Open Session ${output.session}"
    direction: UP
    timeout: 15000
