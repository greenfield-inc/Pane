# Create a pane, find it by search, favorite it, archive it, then delete it
# from Archived. Needs a dev host with at least one repository (README).
appId: com.dcouple.pane.mobile
name: Pane list journeys
---
- runFlow: subflows/signed-in.yaml
- evalScript: ${output.pane = 'mae-' + Date.now().toString(36)}

# Create: repository and base branch default, pick an agent, name the pane.
- tapOn:
    id: panes-new
- extendedWaitUntil:
    visible:
      id: new-pane-branch
    timeout: 15000
# The sheet slides up to its detent; tapping mid-slide hits the wrong row.
- waitForAnimationToEnd
- tapOn:
    id: new-pane-agent-claude
- tapOn:
    id: new-pane-name
- eraseText: 60
- inputText: ${output.pane}
# Return submits the sheet (the keyboard covers the Create button).
- pressKey: Enter
# The new pane opens; come back to the list.
- extendedWaitUntil:
    visible:
      id: pane-detail-screen
    timeout: 60000
# Swipe back (`back` is Android-only); this also checks the full-screen gesture.
- swipe:
    start: 5%, 50%
    end: 90%, 50%
    duration: 400
- extendedWaitUntil:
    visible: "${output.pane}.*"
    timeout: 15000
- assertVisible: ".*Claude Code.*"

# Search narrows the list to matching panes.
- tapOn: "Search panes"
- inputText: ${output.pane}
- assertVisible: "${output.pane}.*"
# iOS 26 shows the search bar's cancel as a close button.
- tapOn: "Close|Cancel"
- waitForAnimationToEnd

# Favorite from the long-press actions, then check the Favorites section.
- longPressOn: "${output.pane}.*"
# The action sheet is titled with the pane it acts on.
- assertVisible: "${output.pane}"
- tapOn: "Favorite"
- extendedWaitUntil:
    visible: "FAVORITES"
    timeout: 10000

# Archive with a swipe and confirm.
- swipe:
    from: "${output.pane}.*"
    direction: LEFT
- tapOn:
    id: "pane-archive-.*"
- tapOn:
    text: "Archive"
    below:
      text: "Archive “.*”\\?"
- extendedWaitUntil:
    notVisible: "${output.pane}.*"
    timeout: 20000

# Delete it for good from Archived.
- scrollUntilVisible:
    element:
      id: panes-archived
    centerElement: true
- tapOn:
    id: panes-archived
- extendedWaitUntil:
    visible: "${output.pane}.*"
    timeout: 15000
- tapOn: "${output.pane}.*"
- tapOn:
    text: "Delete"
    below:
      text: "Delete “.*”\\?"
- extendedWaitUntil:
    notVisible: "${output.pane}.*"
    timeout: 20000
