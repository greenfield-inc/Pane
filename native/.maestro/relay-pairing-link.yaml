# Opening a pairing QR's link (what the phone's camera does with Pane's QR) shows
# "Pair with <computer>"; one tap pairs and opens the computer's Panes.
# PAIRING_URL is a fresh QR link from a computer with phone access on:
#   https://<domain>/pair#s=<secret>&c=<id>&n=<name>
appId: com.dcouple.pane.mobile
name: Pair from a QR link
env:
  METRO_PORT: "8137"
---
- runFlow: subflows/launch-dev-client.yaml
- extendedWaitUntil:
    visible:
      id: connect-open-form
    timeout: 180000
- openLink: ${PAIRING_URL}
# iOS asks before opening a link in the app.
- extendedWaitUntil:
    visible: "Open"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Pair with .*"
    timeout: 10000
- tapOn:
    id: relay-pair-confirm
- extendedWaitUntil:
    visible:
      id: panes-list
    timeout: 30000
