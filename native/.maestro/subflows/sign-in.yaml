# Pairs with the host in CONNECTION_CODE and waits for the pane list.
appId: com.dcouple.pane.mobile
---
- extendedWaitUntil:
    visible:
      id: connect-code-input
    timeout: 180000
- tapOn:
    id: connect-code-input
# Typed in chunks: Android's driver gives up on one command after 120 s.
- inputText: ${CONNECTION_CODE.substring(0, 64)}
- inputText: ${CONNECTION_CODE.substring(64, 128)}
- inputText: ${CONNECTION_CODE.substring(128, 192)}
- inputText: ${CONNECTION_CODE.substring(192, 256)}
- inputText: ${CONNECTION_CODE.substring(256, 320)}
- inputText: ${CONNECTION_CODE.substring(320, 384)}
- inputText: ${CONNECTION_CODE.substring(384, 448)}
- inputText: ${CONNECTION_CODE.substring(448, 512)}
- inputText: ${CONNECTION_CODE.substring(512, 576)}
- inputText: ${CONNECTION_CODE.substring(576, 640)}
- hideKeyboard
- tapOn:
    id: connect-submit
- extendedWaitUntil:
    visible:
      id: panes-list
    timeout: 30000
