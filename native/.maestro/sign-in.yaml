# Sign in with a pane-remote:// code, check the host is connected, sign out.
# Run: see native/README.md ("End-to-end tests").
appId: com.dcouple.pane.mobile
name: Sign in and sign out
---
- runFlow: subflows/launch-dev-client.yaml
- runFlow: subflows/sign-in.yaml
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: connection-status-connected
    timeout: 20000
# The hero card opens Machine details, which holds Sign out.
- tapOn:
    id: settings-current-host
- tapOn:
    id: machine-sign-out
# Confirm in the alert; its buttons sit side by side on iOS 27.
- tapOn:
    text: "Sign Out"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible:
      id: connect-open-form
    timeout: 10000
